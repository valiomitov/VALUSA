<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">

<title>⚽ WC 2026 · Прогнози</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1b2a;min-height:100vh;color:#fff}

/* AUTH */
.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:linear-gradient(135deg,#0d1b2a 0%,#1a237e 60%,#b71c1c 100%)}
.auth-logo{font-size:5rem;margin-bottom:.5rem;text-align:center;filter:drop-shadow(0 0 20px rgba(249,168,37,.6))}
.auth-title{font-size:2.2rem;font-weight:900;text-align:center;letter-spacing:1px;background:linear-gradient(90deg,#fff,#90caf9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-sub{color:rgba(255,255,255,.5);margin-bottom:2rem;text-align:center;font-size:.9rem}
.auth-card{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:2rem;width:100%;max-width:400px}
.auth-tabs{display:flex;background:rgba(0,0,0,.3);border-radius:10px;padding:4px;margin-bottom:1.5rem}
.auth-tab{flex:1;text-align:center;padding:9px;cursor:pointer;border-radius:8px;font-size:14px;font-weight:600;color:rgba(255,255,255,.5);transition:all .2s}
.auth-tab.active{background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.5);margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:11px 14px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:10px;color:#fff;font-size:15px;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus{border-color:#1565c0}
.form-group input::placeholder{color:rgba(255,255,255,.25)}
.form-group select option{background:#1a237e;color:#fff}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.3px}
.btn-primary{background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff}
.btn-primary:hover{background:linear-gradient(135deg,#1976d2,#1565c0);transform:translateY(-1px);box-shadow:0 6px 20px rgba(21,101,192,.4)}
.error-msg{color:#ef9a9a;font-size:13px;margin-top:10px;text-align:center;padding:8px;background:rgba(198,40,40,.15);border-radius:8px}
.admin-hint{margin-top:1rem;text-align:center;font-size:12px;color:rgba(255,255,255,.3)}
.forgot-link{display:block;text-align:center;margin-top:.75rem;font-size:13px;color:rgba(144,202,249,.7);cursor:pointer;text-decoration:underline;background:none;border:none;width:100%}
.forgot-link:hover{color:#90caf9}
.success-msg{color:#a5d6a7;font-size:13px;margin-top:10px;text-align:center;padding:8px;background:rgba(27,94,32,.2);border-radius:8px}
/* PROFILE */
.profile-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:1.5rem;margin-bottom:1rem;max-width:520px;margin-left:auto;margin-right:auto}
.profile-avatar-lg{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#c62828,#e53935);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:2rem;margin:0 auto 1rem}
.profile-username{text-align:center;font-size:1.5rem;font-weight:900;margin-bottom:.25rem}
.profile-email-display{text-align:center;color:rgba(255,255,255,.45);font-size:.9rem;margin-bottom:1.5rem}
.profile-section{border-top:1px solid rgba(255,255,255,.06);padding-top:1.25rem;margin-top:.25rem}

/* HEADER */
.app-header{background:rgba(0,0,0,.5);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.07);padding:0 1.25rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:100}
.app-logo{font-size:1.1rem;font-weight:900;padding:.9rem 0;white-space:nowrap;color:#fff;letter-spacing:.5px}
.app-logo span{color:#f9a825}
.app-nav{display:flex;gap:3px;flex:1;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.app-nav::-webkit-scrollbar{display:none}
.nav-btn{padding:7px 14px;border:none;background:transparent;color:rgba(255,255,255,.55);cursor:pointer;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap;transition:all .2s}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn.active{background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff}
.user-info{display:flex;align-items:center;gap:8px;white-space:nowrap;margin-left:auto}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#c62828,#e53935);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.user-name{font-size:13px;font-weight:700;max-width:100px;overflow:hidden;text-overflow:ellipsis}
.logout-btn{padding:5px 10px;background:rgba(198,40,40,.2);border:1px solid rgba(198,40,40,.3);border-radius:7px;color:#ef9a9a;cursor:pointer;font-size:12px;transition:all .2s;font-weight:600}
.logout-btn:hover{background:rgba(198,40,40,.4);color:#fff}

/* CONTENT */
.main-content{max-width:1000px;margin:0 auto;padding:1.5rem}
.page-title{font-size:1.4rem;font-weight:800;margin-bottom:1.25rem;display:flex;align-items:center;gap:10px}

/* GROUP TABS */
.group-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem}
.group-tab{padding:6px 14px;border:1.5px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.3px;transition:all .2s}
.group-tab:hover{background:rgba(255,255,255,.09);color:#fff}
.group-tab.active{background:#1565c0;border-color:#1565c0;color:#fff}

.kickoff-time{font-size:11px;font-weight:700;color:rgba(255,255,255,.45);letter-spacing:.5px;padding:.4rem 0 .2rem;text-align:center}

/* MATCH CARDS */
.matchday-label{font-size:11px;font-weight:800;text-transform:uppercase;color:rgba(255,255,255,.35);letter-spacing:1.5px;padding:.75rem 0 .4rem;margin-top:.25rem}
.match-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:.9rem 1.1rem;margin-bottom:.6rem;display:flex;align-items:center;gap:.75rem;transition:background .2s}
.match-card:hover{background:rgba(255,255,255,.07)}
.match-card.predicted{border-left:3px solid #4caf50}
.match-card.locked{opacity:.8}
.team{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.team.right{flex-direction:row-reverse}
.team-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-flag{font-size:1.4rem;flex-shrink:0}
.score-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.score-input{width:44px;height:44px;text-align:center;font-size:18px;font-weight:800;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.12);border-radius:9px;color:#fff;outline:none;transition:border-color .2s;-moz-appearance:textfield}
.score-input::-webkit-inner-spin-button,.score-input::-webkit-outer-spin-button{-webkit-appearance:none}
.score-input:focus{border-color:#1565c0}
.score-input:disabled{background:rgba(0,0,0,.2);color:rgba(255,255,255,.4);cursor:not-allowed}
.score-sep{font-size:18px;font-weight:800;color:rgba(255,255,255,.3)}
.result-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.result-score{font-size:20px;font-weight:900;color:#f9a825;min-width:60px;text-align:center}
.result-label{font-size:10px;font-weight:700;text-transform:uppercase;color:rgba(255,255,255,.3);letter-spacing:.5px}
.pts-badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:800;white-space:nowrap}
.pts-3{background:rgba(27,94,32,.8);color:#a5d6a7;border:1px solid rgba(76,175,80,.3)}
.pts-1{background:rgba(13,71,161,.8);color:#90caf9;border:1px solid rgba(21,101,192,.3)}
.pts-2{background:rgba(200,100,0,.8);color:#ffe082;border:1px solid rgba(249,168,37,.3)}
.pts-0{background:rgba(255,255,255,.06);color:rgba(255,255,255,.4)}
.pts-5{background:rgba(255,112,67,.25);color:#ff8a65;border:1px solid rgba(255,112,67,.4);font-weight:800}

/* SAVE BTN */
.save-btn{padding:11px 28px;background:linear-gradient(135deg,#1565c0,#0d47a1);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:1.25rem}
.save-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(21,101,192,.4)}
.info-bar{padding:.6rem 1rem;background:rgba(255,255,255,.04);border-radius:8px;font-size:12px;color:rgba(255,255,255,.5);margin-bottom:1rem}

/* LEADERBOARD */
.lb-wrap{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden}
.lb-head{display:grid;grid-template-columns:48px 1fr 52px 52px 52px 52px 48px 70px;padding:10px 18px;background:rgba(0,0,0,.3);font-size:11px;font-weight:800;text-transform:uppercase;color:rgba(255,255,255,.35);letter-spacing:.5px}
.lb-row{display:grid;grid-template-columns:48px 1fr 52px 52px 52px 52px 48px 70px;padding:13px 18px;border-top:1px solid rgba(255,255,255,.05);align-items:center;transition:background .2s}
.lb-row:hover{background:rgba(255,255,255,.04)}
.lb-row.me{background:rgba(21,101,192,.12);border-left:3px solid #1565c0}
.lb-rank{font-size:15px;font-weight:800}
.rank-1{color:#f9a825}
.rank-2{color:#bdbdbd}
.rank-3{color:#a1887f}
.lb-user{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;min-width:0}
.lb-me-tag{color:#90caf9;font-size:11px;font-weight:600;margin-left:4px}
.lb-stat{text-align:center;font-size:14px}
.lb-total{text-align:center;font-size:19px;font-weight:900;color:#f9a825}
.lb-empty{text-align:center;padding:3rem;color:rgba(255,255,255,.3);font-size:14px}

/* GROUPS */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
.group-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden}
.group-card-hd{background:linear-gradient(135deg,#1565c0,#0d47a1);padding:9px 14px;font-weight:800;font-size:13px;letter-spacing:1px}
.g-table{width:100%;border-collapse:collapse}
.g-table th{padding:7px 10px;font-size:10px;text-align:center;color:rgba(255,255,255,.35);font-weight:800;text-transform:uppercase;background:rgba(0,0,0,.2)}
.g-table th:first-child{text-align:left;width:50%}
.g-table td{padding:9px 10px;font-size:12px;text-align:center;border-top:1px solid rgba(255,255,255,.04)}
.g-table td:first-child{text-align:left;font-weight:700;font-size:13px}
.qualify-row{background:rgba(76,175,80,.07)}
.qualify-row td:first-child::after{content:' ✓';color:#4caf50;font-size:10px}

/* CHAMPION */
.champ-wrap{max-width:550px;margin:1.5rem auto;text-align:center}
.champ-icon{font-size:5rem;margin-bottom:.5rem;filter:drop-shadow(0 0 15px rgba(249,168,37,.5))}
.champ-title{font-size:1.7rem;font-weight:900;margin-bottom:.4rem}
.champ-sub{color:rgba(255,255,255,.5);margin-bottom:1.75rem;font-size:.9rem}
.champ-current{padding:1.25rem;background:rgba(249,168,37,.08);border:2px solid #f9a825;border-radius:14px;margin-bottom:1.5rem}
.champ-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:1.5rem}
.champ-btn{padding:10px 6px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.09);border-radius:10px;color:#fff;cursor:pointer;font-size:12px;text-align:center;transition:all .2s;width:100%}
.champ-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.champ-btn.selected{border-color:#f9a825;background:rgba(249,168,37,.12);color:#f9a825;font-weight:700}
.champ-flag{font-size:1.5rem;display:block;margin-bottom:3px}

/* ADMIN */
.admin-box{background:rgba(198,40,40,.06);border:1px solid rgba(198,40,40,.18);border-radius:14px;padding:1.25rem;margin-bottom:1.25rem}
.admin-note{color:rgba(255,255,255,.5);font-size:13px;margin-bottom:1.25rem;line-height:1.6}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:rgba(27,94,32,.95);border:1px solid rgba(76,175,80,.4);backdrop-filter:blur(10px);border-radius:12px;padding:12px 20px;color:#a5d6a7;font-weight:700;font-size:14px;z-index:999;animation:toastIn .3s ease}
@keyframes toastIn{from{transform:translateX(120px);opacity:0}to{transform:translateX(0);opacity:1}}

/* RESPONSIVE */
@media(max-width:600px){
  .team-name{font-size:12px}
  .match-card{padding:.7rem .8rem;gap:.5rem}
  .score-input{width:38px;height:38px;font-size:16px}
  .lb-head,.lb-row{grid-template-columns:28px 1fr 38px 38px 38px 38px 36px 52px;padding:8px 10px;font-size:10px}
  .champ-grid{grid-template-columns:repeat(3,1fr)}
  .app-logo{font-size:.95rem}
}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(10,18,35,.97);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.08);z-index:200;padding:6px 0 env(safe-area-inset-bottom,6px)}
.bottom-nav-inner{display:flex;justify-content:space-around;align-items:center}
.bnav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;border:none;background:transparent;color:rgba(255,255,255,.45);cursor:pointer;border-radius:10px;transition:all .2s;min-width:56px}
.bnav-btn.active{color:#1976d2}
.bnav-icon{font-size:1.3rem;padding:4px 8px}
.bnav-label{font-size:10px;font-weight:700}
@media(max-width:600px){body{padding-bottom:70px}.app-header .app-nav,.app-header .user-name{display:none}.bottom-nav{display:block}.main-content{padding:1rem .75rem}.team-name{font-size:12px}.match-card{padding:.65rem .75rem}.score-input{width:40px;height:40px;font-size:17px}.lb-head,.lb-row{grid-template-columns:22px 1fr 32px 32px 32px 32px 28px 46px;padding:7px 8px;font-size:9px}.champ-grid{grid-template-columns:repeat(3,1fr)}.groups-grid{grid-template-columns:1fr}.save-btn{width:100%}}
</style>
</head>

// ===================== UTF-8 / BASE64 HELPERS =====================
function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64ToUtf8(b64) {
  const bin = atob(b64.replace(/\n/g,''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

const GH = {
  REPO: 'valiomitov/VALUSA',

  async pull() {

      const data = await r.json();
      if (data._tok) GH.setTok(b64ToUtf8(data._tok));

  },

  async push() {
    const tok = GH.tok();
    if (!tok) { toast('\u274C \u0412\u044A\u0432\u0435\u0434\u0438 Sync Key'); return false; }
    const payload = {

      sessionLog: S.sessionLog,
      _tok: utf8ToB64(tok),

        headers: { Authorization: 'token ' + tok, Accept: 'application/vnd.github.v3+json' }
      });

      const body = { message: 'sync: \u043F\u0440\u043E\u0433\u043D\u043E\u0437\u0438', content: utf8ToB64(JSON.stringify(payload, null, 2)) };
      if (shaD.sha) body.sha = shaD.sha;
      const putR = await fetch('https://api.github.com/repos/' + GH.REPO + '/contents/' + GH.FILE, {
        method: 'PUT',

      return false;
    } catch(e) { toast('\u274C ' + e.message); return false; }
  }
};

// fromFirebase=true → само чете данни, НЕ пише обратно (предотвратява цикъл Firebase→persist→Firebase→...)
function applyGHData(data, fromFirebase = false) {
  if (!data) return;
  if (Array.isArray(data.users)) {
    if (fromFirebase) {
      // Firebase е авторитетен — директно замести (без localOnly merge)
      // Иначе изтрити от admin потребители се връщат обратно
      S.users = data.users;
    } else {
      // GitHub/backup може да е остаряло — запази локално-регистрирани потребители
      const ghNames = new Set(data.users.map(u => u.username));
      const localOnly = S.users.filter(u => !ghNames.has(u.username));
      S.users = [...data.users, ...localOnly];
    }
  }
  if (Array.isArray(data.matches)) {
    S.matches = data.matches;
    // Нормализирай string резултати ("2-1") → {s1,s2} обекти
    S.matches.forEach(m => {
      if (m.result && typeof m.result === 'string') {
        const parts = m.result.split('-');
        const s1 = parseInt(parts[0]), s2 = parseInt(parts[1]);
        m.result = (!isNaN(s1) && !isNaN(s2)) ? {s1, s2} : null;
      }
    });
  }
  if (data.predictions && typeof data.predictions === 'object') {
    // Merge: Firebase + локални данни, но само за валидни потребители (не изтрити)
    const validUsers = new Set(S.users.map(u => u.username));
    const localPredExtra = Object.fromEntries(
      Object.entries(S.predictions).filter(([k]) => !(k in data.predictions) && validUsers.has(k))
    );
    S.predictions = Object.assign({}, data.predictions, localPredExtra);
    // Изтрий данни на изтрити потребители
    Object.keys(S.predictions).forEach(k => { if (!validUsers.has(k)) delete S.predictions[k]; });
  }
  if (data.champions && typeof data.champions === 'object') {
    const validUsers = new Set(S.users.map(u => u.username));
    const localChampExtra = Object.fromEntries(
      Object.entries(S.champions).filter(([k]) => !(k in data.champions) && validUsers.has(k))
    );
    S.champions = Object.assign({}, data.champions, localChampExtra);
    Object.keys(S.champions).forEach(k => { if (!validUsers.has(k)) delete S.champions[k]; });
  }
  if (Array.isArray(data.sessionLog)) S.sessionLog = data.sessionLog;
  if (data.actualWinner !== undefined) S.actualWinner = data.actualWinner || null;
  if (!S.users.find(u => u.username === 'admin')) S.users.push({username:'admin',password:'admin2026'});
  // Само ако НЕ дойде от Firebase listener — иначе правим безкраен цикъл
  if (!fromFirebase) persist();
  else {
    // Само localStorage — без Firebase push
    LS.set('wc26_users', S.users);
    LS.set('wc26_matches', S.matches);
    LS.set('wc26_preds', S.predictions);
    LS.set('wc26_champs', S.champions);
    LS.set('wc26_log', S.sessionLog);
    if (S.actualWinner) LS.set('wc26_winner', S.actualWinner); else LS.del('wc26_winner');
  }
}

// ===================== SCORING =====================

function outcome(s1, s2) {
  return s1 > s2 ? 1 : s1 < s2 ? 2 : 0;
}

function userScore(username) {
  const preds = S.predictions[username] || {};
  let sign = 0, signDiff = 0, exact = 0, exact5 = 0;
  for (const m of S.matches) {
    const p = preds[m.id];
    if (!p || !m.result || typeof m.result !== 'object' || m.result.s1 === undefined) continue;
    if (p.s1 === '' || p.s2 === '') continue;
    const ps1 = parseInt(p.s1), ps2 = parseInt(p.s2);
    const rs1 = m.result.s1, rs2 = m.result.s2;
    if (isNaN(ps1) || isNaN(ps2) || isNaN(rs1) || isNaN(rs2)) continue;
    if (ps1===rs1 && ps2===rs2) {
      if (rs1 + rs2 >= 5) { exact5++; } else { exact++; }
    }
    else if (outcome(ps1,ps2)===outcome(rs1,rs2) && (ps1-ps2)===(rs1-rs2)) { signDiff++; }
    else if (outcome(ps1,ps2)===outcome(rs1,rs2)) { sign++; }
  }
  const champ = S.champions[username] || null;
  const champCorrect = S.actualWinner && champ && champ === S.actualWinner;
  const champPts = champCorrect ? 60 : 0;
  return {sign, signDiff, exact, exact5, champ, champCorrect, champPts,
          total: sign*10 + signDiff*15 + exact*20 + exact5*30 + champPts};
}

function leaderboard() {
  return S.users.filter(u => u.username !== 'admin').map(u => ({username: u.username, ...userScore(u.username)}))
    .sort((a, b) => b.total - a.total || b.exact - a.exact);
}

// --- PREDICTIONS ---
function matchDateKey(m) {
  const t = MATCH_TIMES[m.id];
  if (!t) return '9999-99-99';
  return new Date(t).toLocaleDateString('bg-BG', {timeZone:'Europe/Sofia', year:'numeric', month:'2-digit', day:'2-digit'});
}
function matchDateLabel(m) {
  const t = MATCH_TIMES[m.id]; if (!t) return '';
  return new Date(t).toLocaleDateString('bg-BG', {timeZone:'Europe/Sofia', weekday:'long', day:'numeric', month:'long', year:'numeric'});
}

function renderPredictions() {
  const preds = S.predictions[S.currentUser] || {};
  const view = S.predView || 'group';
  const groupMatches = S.matches.filter(m => m.group);
  const koMatches = S.matches.filter(m => m.stage);
  const totalPred = Object.values(preds).filter(p => p && p.s1 !== '' && p.s2 !== '').length;
  const totalM = groupMatches.length + koMatches.length;

  const STAGE_ORDER = ['R32','R16','QF','SF','3P','F'];
  const STAGE_LABELS = {R32:'1/32-финали',R16:'1/16-финали',QF:'Четвъртфинали',SF:'Полуфинали','3P':'Мач за 3-то място',F:'Финал'};

  let content = '';

  if (view === 'group') {
    // Sort by kickoff, group by date
    const sorted = [...groupMatches].sort((a,b) => {
      const ta = MATCH_TIMES[a.id] ? new Date(MATCH_TIMES[a.id]).getTime() : 0;
      const tb = MATCH_TIMES[b.id] ? new Date(MATCH_TIMES[b.id]).getTime() : 0;
      return ta - tb;
    });
    const byDate = {};
    for (const m of sorted) {
      const dk = matchDateKey(m);
      if (!byDate[dk]) byDate[dk] = {label: matchDateLabel(m), matches:[]};
      byDate[dk].matches.push(m);
    }
    for (const {label, matches} of Object.values(byDate)) {
      content += `<div class="matchday-label">📅 ${label}</div>`;
      content += matches.map(m => {
        const badge = `<span style="font-size:10px;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:10px;color:rgba(255,255,255,.7)">Гр. ${m.group}</span>`;
        return renderMatchCard(m, preds[m.id], false, badge);
      }).join('');
    }
  } else {
    // KO view — grouped by stage, then by date within stage
    for (const stage of STAGE_ORDER) {
      const sm = koMatches.filter(m => m.stage === stage);
      if (!sm.length) continue;
      content += `<div class="matchday-label" style="background:linear-gradient(90deg,rgba(198,40,40,.15),transparent)">⚔️ ${STAGE_LABELS[stage]}</div>`;
      const byDate = {};
      for (const m of sm) {
        const dk = matchDateKey(m);
        if (!byDate[dk]) byDate[dk] = {label: matchDateLabel(m), matches:[]};
        byDate[dk].matches.push(m);
      }
      for (const {label, matches} of Object.values(byDate)) {
        if (label) content += `<div style="padding:6px 0 4px 1rem;font-size:12px;color:rgba(255,255,255,.4)">📅 ${label}</div>`;
        content += matches.map(m => {
          const badge = `<span style="font-size:10px;background:rgba(198,40,40,.2);padding:2px 8px;border-radius:10px;color:#ef9a9a">${m.stageLabel} #${m.matchNum}</span>`;
          return renderMatchCard(m, preds[m.id], false, badge);
        }).join('');
      }
    }
  }

  return `
  <div class="page-title">🔮 Моите прогнози</div>
  <div class="info-bar">
    ⏰ Заключва се 30 мин преди мача &nbsp;·&nbsp; 🔥<strong style="color:#ff7043">30т</strong> точен 5+гола &nbsp;·&nbsp; 💡<strong style="color:#a5d6a7">20т</strong> точен &nbsp;·&nbsp;
    <strong style="color:#90caf9">10т</strong> знак &nbsp;·&nbsp; Прогнозирал: <strong>${totalPred}/${totalM}</strong>
  </div>
  <div class="group-tabs">
    <div class="group-tab ${view==='group'?'active':''}" data-predview="group">📅 Групова фаза</div>
    <div class="group-tab ${view==='ko'?'active':''}" data-predview="ko">⚔️ Елиминации</div>
  </div>
  ${content}
  <div><button class="save-btn" id="savePreds">💾 Запази прогнозите</button></div>`;
}

function renderMatchCard(m, pred, isAdmin, badge = '') {
  const isTBD = m.team1 === 'TBD' || m.team2 === 'TBD';
  const hasPred = pred && pred.s1 !== '' && pred.s2 !== '';
  const hasResult = m.result !== null && typeof m.result === 'object' && m.result.s1 !== undefined;
  const locked = (hasResult || (!isAdmin && isLocked(m.id))) && !isAdmin;
  let pts = '';
  if (hasPred && hasResult && !isAdmin) {
    const ps1 = parseInt(pred.s1), ps2 = parseInt(pred.s2);
    const rs1 = m.result.s1, rs2 = m.result.s2;
    if(ps1===rs1&&ps2===rs2) pts=(rs1+rs2>=5)?`<span class="pts-badge pts-5">🔥 +30т</span>`:`<span class="pts-badge pts-3">🎯 +20т</span>`;
    else if(outcome(ps1,ps2)===outcome(rs1,rs2)&&(ps1-ps2)===(rs1-rs2)) pts=`<span class="pts-badge pts-2">📐 +15т</span>`;
    else if(outcome(ps1,ps2)===outcome(rs1,rs2)) pts=`<span class="pts-badge pts-1">✓ +10т</span>`;
    else pts=`<span class="pts-badge pts-0">✗ 0т</span>`;
  }
  const prefix = isAdmin ? 'adm' : 'pr';
  const t1name = isTBD && !isAdmin ? (m.slotDesc || 'TBD') : m.team1;
  const t2name = isTBD && !isAdmin ? '' : m.team2;
  return `
  <div style="display:flex;align-items:center;gap:6px;padding:${badge?'6px 0 2px':'2px 0'}">
    ${badge}
    ${MATCH_TIMES[m.id] ? `<span style="font-size:11px;color:rgba(255,255,255,.35)">${fmtBG(m.id)}${!hasResult&&isLocked(m.id)?' 🔒':''}</span>` : ''}
  </div>
  ${isTBD && !isAdmin ? `
  <div class="match-card locked" style="opacity:.6">
    <div class="team"><span class="team-name" style="font-size:13px;color:rgba(255,255,255,.45)">⏳ Отборите ще бъдат определени след груповата фаза</span></div>
  </div>` : `
  <div class="match-card ${hasPred&&!isAdmin?'predicted':''} ${locked?'locked':''}">
    <div class="team">
      <span class="team-flag">${FLAGS[m.team1]||'🏳️'}</span>
      <span class="team-name">${m.team1}</span>
    </div>
    <div class="score-wrap">
      <input class="score-input" type="number" min="0" max="30"
        data-${prefix}="${m.id}" data-side="s1"
        value="${isAdmin ? (m.result?m.result.s1:'') : (pred?pred.s1:'')}"
        placeholder="–" ${locked?'disabled':''}>
      <span class="score-sep">:</span>
      <input class="score-input" type="number" min="0" max="30"
        data-${prefix}="${m.id}" data-side="s2"
        value="${isAdmin ? (m.result?m.result.s2:'') : (pred?pred.s2:'')}"
        placeholder="–" ${locked?'disabled':''}>
    </div>
    ${!isAdmin && !locked ? `<button id="sp_${m.id}" onclick="window._savePred(${m.id})"
      style="flex-shrink:0;border:none;cursor:pointer;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;transition:all .2s;
      ${hasPred ? 'background:#1b5e20;color:#a5d6a7' : 'background:#c62828;color:#ffcdd2'}">
      ${hasPred ? '✓' : '💾'}</button>` : ''}
    <div class="team right">
      <span class="team-flag">${FLAGS[m.team2]||'🏳️'}</span>
      <span class="team-name">${m.team2}</span>
    </div>
    ${hasResult && !isAdmin ? `
    <div class="result-wrap">
      <div class="result-label">Резултат</div>
      <div class="result-score">${m.result.s1}:${m.result.s2}</div>
      ${pts}
    </div>` : ''}
    ${isAdmin && hasResult ? `<span class="pts-badge pts-3" style="flex-shrink:0">✓</span>` : ''}
  </div>`}`;
}

function renderGroupCard(gName, teams) {
  const stats = {};
  teams.forEach(t => { stats[t] = {p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}; });
  S.matches.filter(m => m.group === gName && m.result).forEach(m => {
    const s1 = m.result.s1, s2 = m.result.s2;
    stats[m.team1].p++; stats[m.team2].p++;
    stats[m.team1].gf += s1; stats[m.team1].ga += s2;
    stats[m.team2].gf += s2; stats[m.team2].ga += s1;
    if (s1 > s2) { stats[m.team1].w++; stats[m.team1].pts+=3; stats[m.team2].l++; }
    else if (s2 > s1) { stats[m.team2].w++; stats[m.team2].pts+=3; stats[m.team1].l++; }
    else { stats[m.team1].d++; stats[m.team1].pts++; stats[m.team2].d++; stats[m.team2].pts++; }
  });
  const sorted = [...teams].sort((a,b) => {
    if (stats[b].pts !== stats[a].pts) return stats[b].pts - stats[a].pts;
    const gdB = stats[b].gf - stats[b].ga, gdA = stats[a].gf - stats[a].ga;
    if (gdB !== gdA) return gdB - gdA;
    return stats[b].gf - stats[a].gf;
  });
  return `
  <div class="group-card">
    <div class="group-card-hd">ГРУПА ${gName}</div>
    <table class="g-table">
      <thead><tr><th>Отбор</th><th>И</th><th>П</th><th>Р</th><th>З</th><th>Т.</th></tr></thead>
      <tbody>${sorted.map((t,i) => `
        <tr class="${i<2?'qualify-row':''}">
          <td>${FLAGS[t]||''} ${t}</td>
          <td>${stats[t].p}</td><td>${stats[t].w}</td><td>${stats[t].d}</td><td>${stats[t].l}</td>
          <td><strong>${stats[t].pts}</strong></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function normalizeTeam(name) {
  const map = {
    'czech republic':'czechia','czechia':'czechia',
    'korea republic':'south korea','republic of korea':'south korea',
    'south korea':'south korea',
    'bosnia':'bosnia-herzegovina','bosnia & herzegovina':'bosnia-herzegovina',
    'bosnia and herzegovina':'bosnia-herzegovina',
    'dr congo':'congo dr','democratic republic of congo':'congo dr',
    'democratic republic of the congo':'congo dr',
    "cote d'ivoire":'ivory coast',"côte d'ivoire":'ivory coast',
    'ivory coast':'ivory coast',
    'cape verde islands':'cape verde','cabo verde':'cape verde',
    'curacao':'curacao','cura\u00e7ao':'curacao',
    'usa':'united states','united states of america':'united states',
    'u.s.a.':'united states','u.s.':'united states',
    'south africa':'south africa',
    'saudi arabia':'saudi arabia',
    'new zealand':'new zealand',
  };
  const n = (name||'').toLowerCase().trim().replace(/[\u0300-\u036f]/g,'');
  return map[n] || n;
}

async function autoFetchResults(silent=false) {
  const btn = document.getElementById('autoFetchBtn');
  if(btn && !silent) { btn.disabled = true; btn.textContent = '\u23F3 \u0417\u0430\u0440\u0435\u0436\u0434\u0430...'; }
  try {
    // ESPN API - FIFA World Cup
    const urls = [
      'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?limit=200&dates=20260611-20260720',
      'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?limit=200',
    ];
    let events = [];
    for(const url of urls) {
      try {
        const r = await fetch(url);
        const d = await r.json();
        if(d.events && d.events.length) { events = d.events; break; }
      } catch(e) {}
    }
    if(!events.length) { if(!silent) toast('\u274C \u041D\u044F\u043C\u0430 \u0434\u0430\u043D\u043D\u0438 \u043E\u0449\u0435 \u2014 \u0432\u044A\u0437\u043C\u043E\u0436\u043D\u043E \u043C\u0430\u0447\u043E\u0432\u0435\u0442\u0435 \u043D\u0435 \u0441\u0430 \u0437\u0430\u043F\u043E\u0447\u043D\u0430\u043B\u0438.'); return; }
    let updated = 0, skipped = 0;
    for(const ev of events) {
      const comp = ev.competitions && ev.competitions[0];
      if(!comp) continue;
      const status = ev.status && ev.status.type;
      if(!status || !status.completed) { skipped++; continue; }
      const home = comp.competitors && comp.competitors.find(c => c.homeAway === 'home');
      const away = comp.competitors && comp.competitors.find(c => c.homeAway === 'away');
      if(!home || !away) continue;
      const hn = normalizeTeam(home.team.displayName);
      const an = normalizeTeam(away.team.displayName);
      const hs = parseInt(home.score), as2 = parseInt(away.score);
      if(isNaN(hs) || isNaN(as2)) continue;
      const match = S.matches.find(m => {
        const t1 = normalizeTeam(m.team1), t2 = normalizeTeam(m.team2);
        return (t1===hn && t2===an) || (t1===an && t2===hn);
      });
      if(match) {
        const t1isHome = normalizeTeam(match.team1) === hn;
        match.result = { s1: t1isHome ? hs : as2, s2: t1isHome ? as2 : hs };
        updated++;
      }
    }
    // \u2500\u2500 \u0410\u0432\u0442\u043E-\u043F\u043E\u0431\u0435\u0434\u0438\u0442\u0435\u043B: \u043E\u0442\u043A\u0440\u0438\u0439 \u0437\u0430\u0432\u044A\u0440\u0448\u0435\u043D \u0424\u0438\u043D\u0430\u043B \u0438 \u0438\u0437\u0432\u043B\u0435\u0447\u0438 winner \u2500\u2500
    if (!S.actualWinner) {
      const finalMatch = S.matches.find(m => m.stage === 'F');
      if (finalMatch && finalMatch.result && finalMatch.team1 !== 'TBD' && finalMatch.team2 !== 'TBD') {
        // \u041D\u0430\u043C\u0435\u0440\u0438 ESPN event \u0437\u0430 \u0444\u0438\u043D\u0430\u043B\u0430
        for (const ev of events) {
          const comp = ev.competitions && ev.competitions[0];
          if (!comp || !(ev.status && ev.status.type && ev.status.type.completed)) continue;
          const home = comp.competitors && comp.competitors.find(c => c.homeAway === 'home');
          const away = comp.competitors && comp.competitors.find(c => c.homeAway === 'away');
          if (!home || !away) continue;
          const hn = normalizeTeam(home.team.displayName);
          const an = normalizeTeam(away.team.displayName);
          const fn1 = normalizeTeam(finalMatch.team1), fn2 = normalizeTeam(finalMatch.team2);
          if (!((fn1===hn && fn2===an) || (fn1===an && fn2===hn))) continue;
          // ESPN \u043F\u043E\u0441\u0442\u0430\u0432\u044F winner:true \u043D\u0430 \u043F\u043E\u0431\u0435\u0434\u0438\u0442\u0435\u043B\u044F (\u0432\u043A\u043B\u044E\u0447\u0438\u0442\u0435\u043B\u043D\u043E \u0441\u043B\u0435\u0434 \u0434\u0443\u0437\u043F\u0438)
          let winner = null;
          if (home.winner === true) winner = home.team.displayName;
          else if (away.winner === true) winner = away.team.displayName;
          else {
            // Fallback: \u043F\u043E\u0432\u0435\u0447\u0435 \u0433\u043E\u043B\u043E\u0432\u0435 (\u043D\u043E\u0440\u043C\u0430\u043B\u0435\u043D/\u043F\u0440\u043E\u0434\u044A\u043B\u0436\u0435\u043D\u0438\u044F)
            const hs = parseInt(home.score), as2 = parseInt(away.score);
            if (!isNaN(hs) && !isNaN(as2) && hs !== as2) {
              winner = hs > as2 ? home.team.displayName : away.team.displayName;
            }
          }
          if (winner) {
            S.actualWinner = winner;
            if (!silent) toast('\uD83C\uDFC6 \u041F\u043E\u0431\u0435\u0434\u0438\u0442\u0435\u043B \u043D\u0430 \u0442\u0443\u0440\u043D\u0438\u0440\u0430: ' + winner + '! 60\u0442 \u0431\u043E\u043D\u0443\u0441 \u0440\u0430\u0437\u0434\u0430\u0434\u0435\u043D\u0438!');
            console.log('\u0410\u0432\u0442\u043E-\u043F\u043E\u0431\u0435\u0434\u0438\u0442\u0435\u043B:', winner);
          }
          break;
        }
      }
    }

    persist(); render();
    if(updated > 0) {
      const _las = document.getElementById('lastAutoSave');
      if(_las) {
        const _d = new Date();
        const _hh = _d.getHours().toString().padStart(2,'0');
        const _mm = _d.getMinutes().toString().padStart(2,'0');
        _las.textContent = '\u2713 \u0417\u0430\u043F\u0430\u0437\u0435\u043D\u043E \u0432 ' + _hh + ':' + _mm;
        _las.style.display = 'inline';
      }
    }
    if(!silent) toast('\u2705 \u041E\u0431\u043D\u043E\u0432\u0435\u043D\u0438 ' + updated + ' \u0440\u0435\u0437\u0443\u043B\u0442\u0430\u0442\u0430 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u043D\u043E!' + (skipped ? ' ('+skipped+' \u043D\u0435\u0437\u0430\u0432\u044A\u0440\u0448\u0435\u043D\u0438)' : ''));
  } catch(e) {
    if(!silent) toast('\u274C \u0413\u0440\u0435\u0448\u043A\u0430: ' + e.message);
  } finally {
    if(btn && !silent) { btn.disabled = false; btn.textContent = '\u{1F504} \u0410\u0432\u0442\u043E-\u0440\u0435\u0437\u0443\u043B\u0442\u0430\u0442\u0438 \u043E\u0442 FIFA/ESPN'; }
  }
}

function bind() {
  // Auth tabs
  document.querySelectorAll('[data-atab]').forEach(el => el.addEventListener('click', () => {
    S.authTab = el.dataset.atab; S.authError = ''; S.authSuccess = ''; render();
  }));

  // Login
  const lf = document.getElementById('loginForm');
  if (lf) lf.addEventListener('submit', e => {
    e.preventDefault();
    const u = document.getElementById('lu').value.trim();
    const p = document.getElementById('lp').value;
    const user = S.users.find(x => x.username === u && x.password === p);
    if (user) { S.currentUser = u; S.authError = ''; S.sessionLog.push({username: u, action:'login', time: Date.now()}); persist(); render(); }
    else { S.authError = 'Грешно потребителско име или парола'; render(); }
  });

  // Register
  const rf = document.getElementById('regForm');
  if (rf) rf.addEventListener('submit', e => {
    e.preventDefault();
    const u = document.getElementById('ru').value.trim();
    const em = (document.getElementById('re').value || '').trim().toLowerCase();
    const p = document.getElementById('rp').value;
    const p2 = document.getElementById('rp2').value;
    if (u.length < 3) S.authError = 'Потребителското име трябва да е поне 3 символа';
    else if (S.users.find(x => x.username === u)) S.authError = 'Потребителското име е заето';
    else if (em && S.users.find(x => x.email && x.email === em)) S.authError = 'Имейлът вече е регистриран';
    else if (p.length < 4) S.authError = 'Паролата трябва да е поне 4 символа';
    else if (p !== p2) S.authError = 'Паролите не съвпадат';
    else {
      S.users.push({username: u, password: p, email: em || null, registeredAt: Date.now()});
      S.sessionLog.push({username: u, action:'register', time: Date.now()});
      S.currentUser = u; S.authError = ''; persist(); render(); return;
    }
    render();
  });

  // Forgot password
  const ff = document.getElementById('forgotForm');
  if (ff) ff.addEventListener('submit', e => {
    e.preventDefault();
    const u = document.getElementById('fu').value.trim();
    const em = document.getElementById('fe').value.trim().toLowerCase();
    const np = document.getElementById('fnp').value;
    const np2 = document.getElementById('fnp2').value;
    const user = S.users.find(x => x.username === u);
    if (!user) { S.authError = 'Потребителят не е намерен'; render(); return; }
    if (!user.email) { S.authError = 'Няма регистриран имейл — свържи се с администратора'; render(); return; }
    if (user.email !== em) { S.authError = 'Имейлът не съвпада'; render(); return; }
    if (np.length < 4) { S.authError = 'Паролата трябва да е поне 4 символа'; render(); return; }
    if (np !== np2) { S.authError = 'Паролите не съвпадат'; render(); return; }
    user.password = np;
    S.authError = ''; S.authSuccess = 'Паролата е сменена! Влез с новата си парола.';
    persist(); render();
  });

  // Logout
  const lb = document.getElementById('logoutBtn');
  if (lb) lb.addEventListener('click', () => { S.sessionLog.push({username: S.currentUser, action:'logout', time: Date.now()}); S.currentUser = null; persist(); render(); });

  // Nav tabs
  document.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => {
    S.tab = el.dataset.tab; S.profileError = ''; S.profileSuccess = ''; render();
  }));

  // Group tabs (admin panel)
  document.querySelectorAll('[data-group]').forEach(el => el.addEventListener('click', () => {
    S.activeGroup = el.dataset.group; render();
  }));

  // Prediction view tabs (Групова фаза / Елиминации)
  document.querySelectorAll('[data-predview]').forEach(el => el.addEventListener('click', () => {
    S.predView = el.dataset.predview; render();
  }));

  // Admin view tabs
  document.querySelectorAll('[data-adminview]').forEach(el => el.addEventListener('click', () => {
    S.adminView = el.dataset.adminview; render();
  }));

  // Save predictions — reads ALL [data-pr] inputs on page
  const sp = document.getElementById('savePreds');
  if (sp) sp.addEventListener('click', () => {
    if (!S.predictions[S.currentUser]) S.predictions[S.currentUser] = {};
    document.querySelectorAll('[data-pr]').forEach(inp => {
      const mid = parseInt(inp.dataset.pr);
      if (!S.predictions[S.currentUser][mid]) S.predictions[S.currentUser][mid] = {s1:'',s2:''};
      S.predictions[S.currentUser][mid][inp.dataset.side] = inp.value;
    });
    persist(); toast('✅ Прогнозите са запазени!');
  });

  // При промяна на прогноза → иконката на бутона се сменя на незапазена (червена)
  document.querySelectorAll('[data-pr]').forEach(inp => {
    inp.addEventListener('input', () => {
      const mid = inp.dataset.pr;
      const btn = document.getElementById('sp_' + mid);
      if (btn) { btn.textContent = '💾'; btn.style.background = '#c62828'; btn.style.color = '#ffcdd2'; }
    });
  });

  // Save admin results
  const af = document.getElementById('autoFetchBtn');
  if(af) af.addEventListener('click', autoFetchResults);
  const sr = document.getElementById('saveResults');
  if (sr) sr.addEventListener('click', () => {
    document.querySelectorAll('[data-adm]').forEach(inp => {
      const mid = parseInt(inp.dataset.adm);
      const match = S.matches.find(m => m.id === mid);
      if (!match || inp.value === '') return;
      if (!match.result) match.result = {s1:0, s2:0};
      match.result[inp.dataset.side] = parseInt(inp.value);
    });
    // Validate - remove results where one side is missing
    S.matches.forEach(m => {
      if (m.result && (m.result.s1 === undefined || m.result.s2 === undefined ||
          isNaN(m.result.s1) || isNaN(m.result.s2))) m.result = null;
    });
    persist(); toast('✅ Резултатите за Група ' + S.activeGroup + ' са запазени!'); render();
  });

  // Champion
  document.querySelectorAll('[data-champ]').forEach(btn => btn.addEventListener('click', () => {
    if (isChampLocked() && S.currentUser !== 'admin') { toast('🔒 Прогнозата за шампион е заключена!'); return; }
    S.champions[S.currentUser] = btn.dataset.champ;
    persist(); toast('🏆 ' + btn.dataset.champ + ' — прогнозата е запазена!'); render();
  }));

  // Profile — change email
  // Profile forms handled via window._saveProfileEmail / window._saveProfilePw

  // Admin — reset user password
  document.querySelectorAll('[data-reset-user]').forEach(btn => btn.addEventListener('click', () => {
    const uname = btn.dataset.resetUser;
    const newPw = prompt(`Нова парола за "${uname}":`, '');
    if (!newPw || newPw.length < 4) { alert('Паролата трябва да е поне 4 символа.'); return; }
    const user = S.users.find(x => x.username === uname);
    if (user) { user.password = newPw; persist(); toast(`✅ Паролата на ${uname} е ресетната!`); }
  }));

  // Save KO results + team names
  const koBtn = document.getElementById('saveKOResults');
  if (koBtn) koBtn.addEventListener('click', () => {
    // Save team names
    document.querySelectorAll('[data-ko-team]').forEach(inp => {
      const mid = parseInt(inp.dataset.koTeam);
      const m = S.matches.find(x => x.id === mid);
      if (!m) return;
      const val = inp.value.trim() || 'TBD';
      if (inp.dataset.side === 't1') m.team1 = val;
      else m.team2 = val;
    });
    // Save results
    document.querySelectorAll('[data-adm]').forEach(inp => {
      const mid = parseInt(inp.dataset.adm);
      const m = S.matches.find(x => x.id === mid);
      if (!m || inp.value === '') return;
      if (!m.result) m.result = {s1:0, s2:0};
      m.result[inp.dataset.side] = parseInt(inp.value);
    });
    S.matches.forEach(m => {
      if (m.result && (isNaN(m.result.s1) || isNaN(m.result.s2))) m.result = null;
    });
    persist(); render(); toast('✅ Елиминациите са запазени!');
  });

  // Admin add user
  const adminAddUF = document.getElementById('adminAddUserForm');
  if (adminAddUF) adminAddUF.addEventListener('submit', e => {
    e.preventDefault();
    const u = (document.getElementById('adminNewUser').value || '').trim();
    const p = (document.getElementById('adminNewPw').value || '');
    const em = (document.getElementById('adminNewEmail').value || '').trim().toLowerCase();
    if (u.length < 3) { toast('❌ Потребителското ime трябва да е поне 3 символа'); return; }
    if (S.users.find(x => x.username === u)) { toast('❌ Потребителското ime е заето'); return; }
    if (p.length < 4) { toast('❌ Паролата трябва да е поне 4 символа'); return; }
    S.users.push({username: u, password: p, email: em || null, registeredAt: Date.now()});
    persist(); render(); toast('✅ Потребител "' + u + '" е добавен!');
  });

  // Export data.json
  const expBtn = document.getElementById('exportDataBtn');
  if (expBtn) expBtn.addEventListener('click', () => {
    const payload = {
      users: S.users,
      matches: S.matches,
      predictions: S.predictions,
      champions: S.champions,
      sessionLog: S.sessionLog,
      _ts: Date.now()
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'data.json'; a.click();
    URL.revokeObjectURL(url);
    toast('✅ data.json свален!');
  });

  // Import data.json
  const impBtn = document.getElementById('importDataBtn');
  const impFile = document.getElementById('importFileInput');
  if (impBtn && impFile) {
    impBtn.addEventListener('click', () => impFile.click());
    impFile.addEventListener('change', e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const data = JSON.parse(ev.target.result);
          applyGHData(data); render(); toast('✅ Данните са заредени от ' + file.name + '!');
        } catch { toast('❌ Невалиден JSON файл'); }
        impFile.value = '';
      };
      reader.readAsText(file);
    });
  }

  // GitHub Sync (admin only)
  const ghSave = document.getElementById('ghSaveBtn');
  if (ghSave) ghSave.addEventListener('click', () => {
    const tok = (document.getElementById('ghTokInput')||{}).value || '';
    GH.setTok(tok.trim());
    toast(tok.trim() ? '✅ Sync Key запазен!' : '🗑️ Sync Key изтрит');
  });
  const ghPush = document.getElementById('ghPushBtn');
  if (ghPush) ghPush.addEventListener('click', () => {
    ghPush.disabled = true; ghPush.textContent = '⏳ Качване...';
    GH.push().finally(() => { ghPush.disabled = false; ghPush.textContent = '☁️ Качи на GitHub'; });
  });
  const ghPull = document.getElementById('ghPullBtn');
  if (ghPull) ghPull.addEventListener('click', () => {
    ghPull.disabled = true; ghPull.textContent = '⏳ Изтегляне...';
    GH.pull().then(data => {
      if (data) { applyGHData(data); render(); toast('✅ Данните са обновени!'); }
      else toast('❌ Не може да се изтегли от GitHub');
      ghPull.disabled = false; ghPull.textContent = '⬇️ Изтегли от GitHub';
    });
  });
}

function toast(msg) {
  S.toast = msg;
  render();
  setTimeout(() => { S.toast = null; render(); }, 3000);
}

// ===================== GLOBAL AUTH HANDLERS =====================
// Директни onclick функции — по-надеждни от form submit listener
window._setAuthTab = function(tab) {
  S.authTab = tab; S.authError = ''; S.authSuccess = ''; render();
};

window._doLogin = function() {
  const u = (document.getElementById('lu') || {}).value;
  const p = (document.getElementById('lp') || {}).value;
  if (!u || !p) { S.authError = 'Попълни потребителско име и парола'; render(); return; }
  const user = S.users.find(x => x.username === u.trim() && x.password === p);
  if (user) {
    S.currentUser = u.trim(); S.authError = '';
    S.sessionLog.push({username: u.trim(), action:'login', time: Date.now()});
    persist(); render();
  } else {
    S.authError = 'Грешно потребителско ime или парола'; render();
  }
};

window._doRegister = function() {
  const u = (document.getElementById('ru') || {}).value || '';
  const em = ((document.getElementById('re') || {}).value || '').trim().toLowerCase();
  const p = (document.getElementById('rp') || {}).value || '';
  const p2 = (document.getElementById('rp2') || {}).value || '';
  if (u.trim().length < 3) S.authError = 'Потребителското ime трябва да е поне 3 символа';
  else if (S.users.find(x => x.username === u.trim())) S.authError = 'Потребителското ime е заето';
  else if (em && S.users.find(x => x.email && x.email === em)) S.authError = 'Имейлът вече е регистриран';
  else if (p.length < 4) S.authError = 'Паролата трябва да е поне 4 символа';
  else if (p !== p2) S.authError = 'Паролите не съвпадат';
  else {
    S.users.push({username: u.trim(), password: p, email: em || null, registeredAt: Date.now()});
    S.sessionLog.push({username: u.trim(), action:'register', time: Date.now()});
    S.currentUser = u.trim(); S.authError = ''; persist(); render(); return;
  }
  render();
};

window._doForgot = function() {
  const u = ((document.getElementById('fu') || {}).value || '').trim();
  const em = ((document.getElementById('fe') || {}).value || '').trim().toLowerCase();
  const np = (document.getElementById('fnp') || {}).value || '';
  const np2 = (document.getElementById('fnp2') || {}).value || '';
  const user = S.users.find(x => x.username === u);
  if (!user) { S.authError = 'Потребителят не е намерен'; render(); return; }
  if (!user.email) { S.authError = 'Няма регистриран имейл — свържи се с администратора'; render(); return; }
  if (user.email !== em) { S.authError = 'Имейлът не съвпада'; render(); return; }
  if (np.length < 4) { S.authError = 'Паролата трябва да е поне 4 символа'; render(); return; }
  if (np !== np2) { S.authError = 'Паролите не съвпадат'; render(); return; }
  user.password = np;
  S.authError = ''; S.authSuccess = 'Паролата е сменена! Влез с новата си парола.';
  persist(); render();
};

// Profile save functions
window._saveProfileEmail = function() {
  const em = ((document.getElementById('peEmail') || {}).value || '').trim().toLowerCase();
  const user = S.users.find(x => x.username === S.currentUser);
  if (!user) return;
  if (em && S.users.find(x => x.username !== S.currentUser && x.email && x.email === em)) {
    S.profileError = 'Имейлът вече се използва от друг потребител'; S.profileSuccess = ''; render(); return;
  }
  user.email = em || null;
  S.profileError = ''; S.profileSuccess = 'Имейлът е запазен!';
  persist(); render();
};

window._saveProfilePw = function() {
  const cur = (document.getElementById('peCurPw') || {}).value || '';
  const np  = (document.getElementById('peNewPw') || {}).value || '';
  const np2 = (document.getElementById('peNewPw2') || {}).value || '';
  const user = S.users.find(x => x.username === S.currentUser);
  if (!user) return;
  if (user.password !== cur) { S.profileError = 'Грешна текуща парола'; S.profileSuccess = ''; render(); return; }
  if (np.length < 4) { S.profileError = 'Новата парола трябва да е поне 4 символа'; S.profileSuccess = ''; render(); return; }
  if (np !== np2) { S.profileError = 'Паролите не съвпадат'; S.profileSuccess = ''; render(); return; }
  user.password = np;
  S.profileError = ''; S.profileSuccess = 'Паролата е сменена успешно!';
  persist(); render();
};

// Per-match save
window._savePred = function(mid) {
  const inp1 = document.querySelector('[data-pr="'+mid+'"][data-side="s1"]');
  const inp2 = document.querySelector('[data-pr="'+mid+'"][data-side="s2"]');
  if (!inp1 || !inp2) return;
  if (inp1.value === '' || inp2.value === '') { toast('⚠️ Въведи и двата резултата'); return; }
  if (!S.predictions[S.currentUser]) S.predictions[S.currentUser] = {};
  if (!S.predictions[S.currentUser][mid]) S.predictions[S.currentUser][mid] = {s1:'',s2:''};
  S.predictions[S.currentUser][mid].s1 = inp1.value;
  S.predictions[S.currentUser][mid].s2 = inp2.value;
  persist();
  const btn = document.getElementById('sp_'+mid);
  if (btn) { btn.textContent = '✓'; btn.style.background = '#1b5e20'; btn.style.color = '#a5d6a7'; }
};

window._setActualWinner = function() {
  const val = ((document.getElementById('actualWinnerInput') || {}).value || '').trim();
  if (!val) { toast('⚠️ Въведи името на победителя'); return; }
  S.actualWinner = val;
  persist();
  render();
  toast('🏆 Победителят е записан: ' + val + '. 60т бонус раздадени!');
};

window._downloadBackup = function() {
  const backup = {
    exportedAt: new Date().toISOString(),
    exportedBy: S.currentUser,
    users: S.users,
    predictions: S.predictions,
    champions: S.champions,
    matches: S.matches,
    sessionLog: S.sessionLog
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'wc26_backup_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  toast('✅ Бекъпът е изтеглен!');
};

window._deleteUser = function(username) {
  if (username === 'admin') { toast('❌ Не може да изтриеш admin!'); return; }
  if (!confirm('Сигурен ли си, че искаш да изтриеш потребител "' + username + '"?\n\nВсички прогнози на потребителя ще бъдат изтрити!')) return;
  S.users = S.users.filter(u => u.username !== username);
  delete S.predictions[username];
  delete S.champions[username];
  persist();
  FB.deleteUserData(username); // Изрично изтрий от Firebase пътищата predictions/X и champions/X
  render();
  toast('🗑️ Потребител "' + username + '" е изтрит.');
};

// ===================== INIT =====================
// render() веднага — страницата се показва без да чака Firebase/GitHub
try {
  render();
} catch(e) {
  document.getElementById('root').innerHTML =
    '<div style="color:white;background:#c0392b;padding:2rem;font-family:monospace;font-size:0.9rem">' +
    '<b>❌ JavaScript грешка при зареждане:</b><br><br>' + e.message + '<br><br>' + (e.stack||'').replace(/\n/g,'<br>') + '</div>';
  throw e;
}

// Автоматично изтегляне на КО двойките от ESPN API
async function fetchKOPairings() {
  // ESPN API за WC 2026 КО мачове
  const ESPN_URL = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard';
  try {
    const res = await fetch(ESPN_URL);
    if (!res.ok) return;
    const json = await res.json();
    const events = json.events || [];
    let changed = false;
    for (const ev of events) {
      const comps = ev.competitions || [];
      for (const comp of comps) {
        const teams = comp.competitors || [];
        if (teams.length < 2) continue;
        const t1 = teams.find(t => t.homeAway === 'home');
        const t2 = teams.find(t => t.homeAway === 'away');
        if (!t1 || !t2) continue;
        const name1 = t1.team?.displayName || t1.team?.name;
        const name2 = t2.team?.displayName || t2.team?.name;
        if (!name1 || !name2) continue;
        // Намери KO мач по дата/час
        const evDate = new Date(ev.date);
        const koMatch = S.matches.find(m =>
          m.stage && (m.team1 === 'TBD' || m.team2 === 'TBD') &&
          m.kickoff && Math.abs(new Date(m.kickoff).getTime() - evDate.getTime()) < 3600000
        );
        if (!koMatch) continue;
        // Попълни отборите само ако са TBD
        if (koMatch.team1 === 'TBD') { koMatch.team1 = name1; changed = true; }
        if (koMatch.team2 === 'TBD') { koMatch.team2 = name2; changed = true; }
        // Попълни и резултата ако е наличен
        const score = comp.score;
        if (score && comp.status?.type?.completed) {
          const s1 = parseInt(t1.score); const s2 = parseInt(t2.score);
          if (!isNaN(s1) && !isNaN(s2) && !koMatch.result) {
            koMatch.result = {s1: s1, s2: s2};
            changed = true;
          }
        }
      }
    }
    if (changed) { persist(); render(); console.log('ESPN: КО двойките обновени'); }
  } catch(e) { console.warn('ESPN fetch error:', e.message); }
}

// ===================== POST-LOAD INIT =====================
// Firebase SDK е зареден накрая в <body> — трябва да изчакаме window.load
window.addEventListener('load', function() {
  // Инициализирай Firebase (SDK е заредено вече)
  FB.init();

  // Auto-pull от GitHub само ако Firebase НЕ е конфигуриран
  if (!FB_CONFIG.databaseURL) {
    GH.pull().then(data => { if (data) { applyGHData(data); render(); } });
  }

  // ESPN КО sync след 3 секунди
  setTimeout(fetchKOPairings, 3000);

  // ===================== AUTO REFRESH =====================
  const WC_START = new Date('2026-06-11T00:00:00+03:00').getTime();
  const WC_END   = new Date('2026-07-21T23:59:00+03:00').getTime(); // +2 дни след финала
  const INTERVAL = 5 * 60 * 1000; // 5 minutes

  function tryAutoFetch() {
    const now = Date.now();
    if(now >= WC_START && now <= WC_END) {
      autoFetchResults(true);
    }
  }

  if(Date.now() >= WC_START && Date.now() <= WC_END) {
    setInterval(tryAutoFetch, INTERVAL);
    const badge = document.getElementById('autoRefreshBadge');
    if(badge) badge.style.display = 'inline';
    setTimeout(tryAutoFetch, 3000);
    setInterval(fetchKOPairings, INTERVAL);
  }
});
